name: CI - Quad-Check Pipeline

on:
  pull_request:
    branches: [main, feat/redesign]

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --frozen-lockfile
      - name: Run type-check
        id: type-check
        run: npm run type-check
        continue-on-error: true
      - name: Type-check Summary (success)
        if: steps.type-check.outcome == 'success'
        run: |
          {
            echo "## ✅ TypeScript Type Check"
            echo ""
            echo "No type errors found."
          } >> $GITHUB_STEP_SUMMARY
      - name: Type-check Summary (failure)
        if: steps.type-check.outcome == 'failure'
        run: |
          {
            echo "## ❌ TypeScript Type Check"
            echo ""
            echo '```'
            echo "Type-check failed — check the logs above for details."
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit 1

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --frozen-lockfile
      - name: Run ESLint
        id: lint
        run: npm run lint
        continue-on-error: true
      - name: ESLint Summary (success)
        if: steps.lint.outcome == 'success'
        run: |
          {
            echo "## ✅ ESLint"
            echo ""
            echo "No linting errors found."
          } >> $GITHUB_STEP_SUMMARY
      - name: ESLint Summary (failure)
        if: steps.lint.outcome == 'failure'
        run: |
          {
            echo "## ❌ ESLint"
            echo ""
            echo "Linting failed — check the logs above for details."
          } >> $GITHUB_STEP_SUMMARY
          exit 1

  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --frozen-lockfile
      - run: npx vitest --run --reporter=json > vitest-results.json 2>vitest-stderr.txt
        continue-on-error: true
      - name: Vitest Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const write = (s) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, s + '\n');

            if (!fs.existsSync('vitest-results.json') || !fs.statSync('vitest-results.json').size) {
              const stderr = fs.existsSync('vitest-stderr.txt') ? fs.readFileSync('vitest-stderr.txt','utf8').trim() : 'No output';
              write('## ❌ Unit Tests\n\nFailed to produce results.\n\n```\n' + stderr + '\n```');
              process.exit(0);
            }

            const data = JSON.parse(fs.readFileSync('vitest-results.json','utf8'));
            const failed = data.numFailedTests || 0;
            const passed = data.numPassedTests || 0;
            const total = data.numTotalTests || 0;
            const icon = failed === 0 ? '✅' : '❌';
            write('## ' + icon + ' Unit Tests (' + passed + '/' + total + ' passed)');
            write('');

            (data.testResults || []).forEach(file => {
              const fIcon = file.assertionResults.every(t => t.status === 'passed') ? '✅' : '❌';
              write('### ' + fIcon + ' ' + (file.name || ''));
              (file.assertionResults || []).forEach(test => {
                const sym = test.status === 'passed' ? '✅' : test.status === 'failed' ? '❌' : '⏭️';
                write('- ' + sym + ' ' + test.title);
                if (test.status === 'failed' && test.failureMessages) {
                  test.failureMessages.forEach(msg => {
                    const lines = msg.split('\n').slice(0, 4);
                    write('  ```\n  ' + lines.join('\n  ') + '\n  ```');
                  });
                }
              });
              write('');
            });
          " >> $GITHUB_STEP_SUMMARY
      - run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('vitest-results.json') && fs.statSync('vitest-results.json').size) {
              const data = JSON.parse(fs.readFileSync('vitest-results.json','utf8'));
              if (data.numFailedTests > 0) process.exit(1);
            } else {
              process.exit(1);
            }
          "

  e2e-tests:
    name: Playwright E2E Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --frozen-lockfile
      - name: Build for preview
        run: npm run build
      - name: Run E2E tests
        run: npx playwright test --reporter=json > pw-results.json 2>pw-stderr.txt
        continue-on-error: true
      - name: Playwright Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const write = (s) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, s + '\n');

            if (!fs.existsSync('pw-results.json') || !fs.statSync('pw-results.json').size) {
              const stderr = fs.existsSync('pw-stderr.txt') ? fs.readFileSync('pw-stderr.txt','utf8').trim() : 'No output';
              write('## ❌ E2E Tests\n\nFailed to produce results.\n\n```\n' + stderr + '\n```');
              process.exit(0);
            }

            const result = JSON.parse(fs.readFileSync('pw-results.json','utf8'));
            const suites = result.suites || [];
            const allSpecs = suites.flatMap(s => s.specs || []);
            const failed = allSpecs.filter(s => !s.ok).length;
            const passed = allSpecs.length - failed;
            const icon = failed === 0 ? '✅' : '❌';
            write('## ' + icon + ' E2E Tests (' + passed + '/' + allSpecs.length + ' passed)');
            write('');

            suites.forEach(suite => {
              write('### ' + (suite.title || 'Tests'));
              (suite.specs || []).forEach(spec => {
                const project = spec.tests?.[0]?.projectName || '?';
                const sym = spec.ok ? '✅' : '❌';
                write('- ' + sym + ' [' + project + '] ' + spec.title);
                if (!spec.ok && spec.tests?.[0]?.results?.[0]?.error?.message) {
                  const lines = spec.tests[0].results[0].error.message.split('\n').slice(0, 3);
                  write('  ```\n  ' + lines.join('\n  ') + '\n  ```');
                }
              });
              write('');
            });
          " >> $GITHUB_STEP_SUMMARY
      - run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('pw-results.json') && fs.statSync('pw-results.json').size) {
              const result = JSON.parse(fs.readFileSync('pw-results.json','utf8'));
              const failed = (result.suites || []).flatMap(s => s.specs || []).filter(s => !s.ok).length;
              if (failed > 0) process.exit(1);
            } else {
              process.exit(1);
            }
          "

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --frozen-lockfile
      - name: Run build
        id: build-step
        run: npm run build
        continue-on-error: true
      - name: Build Summary (success)
        if: steps.build-step.outcome == 'success'
        run: |
          {
            echo "## ✅ Vite Build"
            echo ""
            echo "Build succeeded — \`dist/\` output ready."
          } >> $GITHUB_STEP_SUMMARY
      - name: Build Summary (failure)
        if: steps.build-step.outcome == 'failure'
        run: |
          {
            echo "## ❌ Vite Build"
            echo ""
            echo "Build failed — check the logs above for details."
          } >> $GITHUB_STEP_SUMMARY
          exit 1
